[package]
name = "embers-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
poise = "0.6.2"
serenity = { version = "0.12", default-features = false, features = ["cache"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
debug = false
incremental = false
panic = "abort"
